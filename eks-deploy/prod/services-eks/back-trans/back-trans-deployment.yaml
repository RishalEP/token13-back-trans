apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-trans-prod
  namespace: prod
  labels:
    app: back-trans-prod
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: back-trans-prod
  template:
    metadata:
      labels:
        app: back-trans-prod
      annotations:
        force-reload: "0"
    spec:
      containers:
        - name: back-trans-prod
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/<ECR_REPOSITORY>:back-trans-prod-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
              name: http-8800
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: back-trans-prod-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: back-trans-prod-secrets
                  key: REDIS_URL
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
  
