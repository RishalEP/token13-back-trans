apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-trans
  namespace: prod
  labels:
    app: back-trans
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: back-trans
  template:
    metadata:
      labels:
        app: back-trans
      annotations:
        force-reload: "0"
    spec:
      containers:
        - name: back-trans
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
              name: http-8800
          envFrom:
            - secretRef:
                name: back-trans-secrets
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
          # --- Probes: This tells Kubernetes when it's safe to switch traffic ---
          readinessProbe:
            httpGet:
              path: /quicknode-webhook/health
              port: 8800
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /quicknode-webhook/health
              port: 8800
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
  
