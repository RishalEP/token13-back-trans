apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-trans-prod
  namespace: prod
  labels:
    app: back-trans-prod
spec:
  revisionHistoryLimit: 3
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: back-trans-prod
  template:
    metadata:
      labels:
        app: back-trans-prod
      annotations:
        force-reload: "0"
    spec:
      containers:
        - name: back-trans-prod
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/<ECR_REPOSITORY>:back-trans-prod-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8800
              name: http-8800
          envFrom:
            - secretRef:
                name: back-trans-prod-secrets
          env:
            - name: FCM_CREDENTIALS_FILE
              value: /etc/secrets/firebase.json
          volumeMounts:
            - name: firebase-secret
              mountPath: /etc/secrets
              readOnly: true
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: firebase-secret
          secret:
            secretName: back-trans-prod-secrets
            items:
              - key: FCM_CREDENTIALS_FILE
                path: firebase.json
