name: Back-trans Prod Ingress CI/CD to EKS Production

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'eks-deploy/prod/tools/ingress/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Ingress to EKS via AWS SSM
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      BASTION_INSTANCE_ID: ${{ secrets.BASTION_INSTANCE_ID }}

      # Notification metadata
      ENVIRONMENT: Production
      BACKEND_SERVICE: back-trans-prod-ingress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate Secure Ingress Payload
        id: prep_payload
        run: |
          set -euo pipefail
          
          # 1. Capture manifests
          ALL_INGRESS_YAML=$(cat ./eks-deploy/prod/tools/ingress/*.yaml)
          
          # 2. Create a timestamp
          DEPLOY_DATE=$(date)

          cat << EOF > deploy_ingress.sh
          set -euo pipefail
          export HOME=/home/ubuntu
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

          echo "=== Applying Ingress with Timestamp: $DEPLOY_DATE ==="
          
          # We use kubectl patch immediately after apply to stamp the time
          kubectl apply -f - << 'INGRESS_BLOCK'
          $ALL_INGRESS_YAML
          INGRESS_BLOCK

          # This 'stamps' the ingress so you can see the update time in 'describe'
          kubectl annotate ingress back-trans-ingress -n prod deployment-date="$DEPLOY_DATE" --overwrite

          echo "=== Verification ==="
          kubectl describe ing back-trans-ingress -n prod | grep "deployment-date"
          EOF

          echo "PAYLOAD=$(gzip -c deploy_ingress.sh | base64 -w 0)" >> $GITHUB_ENV

      - name: Execute Ingress Deployment via AWS SSM
        run: |
          echo "🚀 Deploying Ingress via SSM tunnel..."

          SSM_PARAMS=$(jq -n \
            --arg cmd "echo '$PAYLOAD' | base64 -d | gunzip | bash" \
            '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.BASTION_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMS" \
            --comment "EKS Ingress Deploy: Build ${{ github.run_id }}" \
            --query "Command.CommandId" \
            --output text)

          echo "⏳ Waiting for SSM Command: $COMMAND_ID"
          
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query "CommandInvocations[0].Status" --output text)
            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ Ingress applied successfully!"
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "❌ Ingress deployment failed!"
              aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ env.BASTION_INSTANCE_ID }}" --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 5
          done
      # ===============================
      # LARK NOTIFICATION (ALWAYS)
      # ===============================
      - name: Notify Lark – Deployment Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          DEPLOY_TIME=$(TZ=Asia/Dubai date '+%d/%m/%Y & %I:%M %p')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME=$(basename "${{ github.repository }}")

          ICON="ℹ️"
          TITLE="Deployment Update"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Deployment Successful"
          elif [ "$STATUS" = "failure" ]; then
            ICON="🚨"
            TITLE="Deployment Failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.LARK_WEBHOOK_URL_PROD }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"msg_type\": \"interactive\",
            \"card\": {
              \"header\": {
                \"title\": {
                  \"tag\": \"plain_text\",
                  \"content\": \"$ICON $REPO_NAME – $TITLE\"
                }
              },
              \"elements\": [
                {
                  \"tag\": \"div\",
                  \"text\": {
                    \"tag\": \"lark_md\",
                    \"content\": \"📦 **Repository:** $REPO_NAME\n🔖 Commit: \`$SHORT_SHA\`\n⏰ Deployment Time: $DEPLOY_TIME\n🌍 Environment: ${{ env.ENVIRONMENT }}\n👤 Deployed By: ${{ github.actor }}\n\n🧩 Backend Services Impacted:\n• ⚙️ ${{ env.BACKEND_SERVICE }}\n\n📊 Status: $STATUS\n👉 [View Logs]($RUN_URL)\"
                  }
                }
              ]
            }
          }"