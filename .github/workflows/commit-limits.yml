name: PR Commit Limit with Comments

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-pr-commit-limit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}

      - name: Fetch main branch
        run: git fetch origin main

      - name: Get file-modifying commits in PR
        id: get_commits
        run: |
          # List commits in PR that modify files and ignore merges
          commits=$(git log --no-merges origin/main..HEAD --pretty=format:"%h %s" --diff-filter=AM)
          count=$(echo "$commits" | wc -l)
          echo "commit_count=$count" >> $GITHUB_OUTPUT
          echo "commit_list<<EOF" >> $GITHUB_OUTPUT
          echo "$commits" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fail if commit limit exceeded and comment on PR
        uses: peter-evans/create-or-update-comment@v4
        if: ${{ steps.get_commits.outputs.commit_count > 4 }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ❌ **PR exceeds the 4 file-modifying commit limit!**
            
            This PR has ${{ steps.get_commits.outputs.commit_count }} file-modifying commits:
            ```
            ${{ steps.get_commits.outputs.commit_list }}
            ```
            
            Please squash or reduce commits before merging.
          
      - name: Fail workflow if commit limit exceeded
        if: ${{ steps.get_commits.outputs.commit_count > 4 }}
        run: |
          echo "❌ Commit limit exceeded. See PR comment for details."
          exit 1
