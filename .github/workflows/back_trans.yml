      #     ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "
      #        cd /home/backtrans/ &&
      #        docker-compose down &&
      #        docker-compose up -d --build
      #       docker run -p 
      #     "

