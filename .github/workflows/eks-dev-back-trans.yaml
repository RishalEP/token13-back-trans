name: Back-trans Backend CI/CD To EKS Development

on:
  push:
    branches:
      - dev
    # paths:
    #   - 'eks-deploy/dev/services-eks/back-trans/**'
  workflow_dispatch:

env:
  IMAGE_BASENAME: back-trans-dev
  LATEST_TAG: back-trans-dev-latest
  ROLLBACK_TAG: back-trans-dev-rollback

  # Notification metadata
  ENVIRONMENT: Development
  IOS_VERSION: "1.5v"
  ANDROID_VERSION: "1.5v"
  BACKEND_SERVICE: back-trans-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
      JUMP_USER: ${{ secrets.SSH_JUMP_USER }}
      JUMP_HOST: ${{ secrets.SSH_JUMP_HOST }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Shift latest → rollback
        run: |
          set -euo pipefail
          LATEST_DIGEST=$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${LATEST_TAG}" \
            --output json 2>/dev/null | jq -r '.imageDetails[0].imageDigest // empty')

          ROLLBACK_DIGEST=$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${ROLLBACK_TAG}" \
            --output json 2>/dev/null | jq -r '.imageDetails[0].imageDigest // empty')

          if [ -z "$LATEST_DIGEST" ]; then
            echo "ℹ️ No latest image found, skipping rollback shift"
            exit 0
          fi

          if [ "$LATEST_DIGEST" = "$ROLLBACK_DIGEST" ]; then
            echo "ℹ️ latest and rollback already point to same digest"
            exit 0
          fi

          MANIFEST=$(aws ecr batch-get-image \
            --region "$AWS_REGION" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${LATEST_TAG}" \
            --output json | jq -r '.images[0].imageManifest')

          aws ecr batch-delete-image \
            --region "$AWS_REGION" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${ROLLBACK_TAG}" || true

          aws ecr put-image \
            --region "$AWS_REGION" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-tag "${ROLLBACK_TAG}" \
            --image-manifest "$MANIFEST"

          echo "✅ Shifted latest → rollback successfully"

      - name: Build & push back-trans image
        id: build
        run: |
          REPO="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          IMAGE="${REPO}:${LATEST_TAG}"
          docker build -t "$IMAGE" -f ./Dockerfile .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT

      - name: Generate Secure Deployment Payload
        id: prep_payload
        env:
          SECRET_JSON: ${{ secrets.EKS_DEV_BACK_TRANS_SECRETS }}
          LATEST_IMAGE: ${{ steps.build.outputs.IMAGE }}
        run: |
          set -euo pipefail
          
          # 1. Format Secrets into a K8s Manifest
          SECRET_MANIFEST=$(echo "$SECRET_JSON" | jq -r '
            {
              apiVersion: "v1",
              kind: "Secret",
              metadata: { name: "back-trans-dev-secrets", namespace: "dev" },
              type: "Opaque",
              data: (to_entries | map({key: .key, value: (.value | @base64)}) | from_entries)
            }
          ')

          # 2. Read Local Files
          DEPLOY_YML=$(cat ./eks-deploy/dev/services-eks/back-trans/back-trans-deployment.yaml)
          SERVICE_YML=$(cat ./eks-deploy/dev/services-eks/back-trans/back-trans-service.yaml)
          HPA_YML=$(cat ./eks-deploy/dev/services-eks/back-trans/back-trans-hpa.yaml)

          # Replace IMAGE_PLACEHOLDER with latest image
          DEPLOY_YML="${DEPLOY_YML//IMAGE_PLACEHOLDER/$LATEST_IMAGE}"

          # 3. Construct the execution script (Simple & Readable)
          cat << EOF > deploy_step.sh
          set -euo pipefail
          export HOME=/home/ubuntu
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}"

          echo "Updating Kubernetes Resources..."
          
          kubectl apply -f - << 'K8S_SECRET'
          $SECRET_MANIFEST
          K8S_SECRET

          kubectl apply -f - << 'K8S_DEPLOY'
          $DEPLOY_YML
          K8S_DEPLOY

          kubectl apply -f - << 'K8S_SERVICE'
          $SERVICE_YML
          K8S_SERVICE

          kubectl apply -f - << 'K8S_HPA'
          $HPA_YML
          K8S_HPA

          echo "Restarting deployment to ensure fresh image pull..."
          kubectl -n dev rollout restart deployment/back-trans-dev
          kubectl -n dev rollout status deployment/back-trans-dev --timeout=3m
          EOF

          # 4. Package for SSM
          echo "PAYLOAD=$(gzip -c deploy_step.sh | base64 -w 0)" >> $GITHUB_ENV


      - name: Deploy to EKS via AWS SSM
        run: |
          set -euo pipefail
          SSM_PARAMS=$(jq -n --arg cmd "echo '$PAYLOAD' | base64 -d | gunzip | bash" '{commands: [$cmd]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$BASTION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$SSM_PARAMS" \
            --query "Command.CommandId" --output text)

          echo "⏳ Waiting for SSM Command: $COMMAND_ID"
          while true; do
            STATUS=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query "CommandInvocations[0].Status" --output text)
            if [[ "$STATUS" == "Success" ]]; then
              echo "✅ Success!"; break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "❌ Failed!"; aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$BASTION_INSTANCE_ID" --query "StandardErrorContent" --output text; exit 1
            fi
            sleep 5
          done

      # ===============================
      # LARK NOTIFICATION (ALWAYS)
      # ===============================
      - name: Notify Lark – Deployment Status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          DEPLOY_TIME=$(TZ=Asia/Dubai date '+%d/%m/%Y & %I:%M %p')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME=$(basename "${{ github.repository }}")

          ICON="ℹ️"
          TITLE="Deployment Update"
          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Deployment Successful"
          elif [ "$STATUS" = "failure" ]; then
            ICON="🚨"
            TITLE="Deployment Failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -X POST "${{ secrets.LARK_WEBHOOK_URL_DEV }}" \
          -H "Content-Type: application/json" \
          -d "{
            \"msg_type\": \"interactive\",
            \"card\": {
              \"header\": {
                \"title\": {
                  \"tag\": \"plain_text\",
                  \"content\": \"$ICON $REPO_NAME – $TITLE\"
                }
              },
              \"elements\": [
                {
                  \"tag\": \"div\",
                  \"text\": {
                    \"tag\": \"lark_md\",
                    \"content\": \"📦 **Repository:** $REPO_NAME\n🔖 Commit: \`$SHORT_SHA\`\n⏰ Deployment Time: $DEPLOY_TIME\n🌍 Environment: ${{ env.ENVIRONMENT }}\n👤 Deployed By: ${{ github.actor }}\n\n📱 **Affected Products:**\n• 🍎 iOS: ${{ env.IOS_VERSION }}\n• 🤖 Android: ${{ env.ANDROID_VERSION }}\n\n🧩 Backend Services Impacted:\n• ⚙️ ${{ env.BACKEND_SERVICE }}\n\n📊 Status: $STATUS\n👉 [View Logs]($RUN_URL)\"
                  }
                }
              ]
            }
          }"